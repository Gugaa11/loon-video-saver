# Loon Video Saver 本地配置片段
# 要求：Loon 3.5.1 (983) 或更高版本
# 前置：把 video-saver.js 放到 iCloud Drive/Loon/Script/，并在 Loon 中恢复本地脚本。
#
# 请把下面每个区块中的“配置行”合并到你现有配置的同名区块中。
# 如果现有配置已经有 [Rule]、[Host]、[Script]、[Mitm]，不要重复粘贴区块标题。

[Rule]
DOMAIN,video-saver.loon,DIRECT

[Host]
video-saver.loon = 127.0.0.1

[Script]
request if ${url} ~= /^http:\/\/video-saver\.loon\/resolve(?:\?|$)/i then script("video-saver.js") with tag="解析分享视频", timeout=60
response if ${url} ~= /^https:\/\/[^/]*(?:amemv\.com|douyin\.com|snssdk\.com)\/aweme\/v\d+\/(?:feed|aweme\/detail|aweme\/post|search\/item)\//i then script("video-saver.js") with tag="缓存抖音视频地址", timeout=15, requires_body=true

[Mitm]
hostname = *.amemv.com, api.douyin.com, aweme.snssdk.com
